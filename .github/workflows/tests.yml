name: tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.3'
            pest: '^3.8'
            inertia: '^2.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.3'
            pest: '^3.8'
            inertia: '^2.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            inertia: '^3.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            inertia: '^3.0'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: sqlite3

      - name: Install matrix dependencies
        run: |
          composer require --dev \
            laravel/framework:${{ matrix.laravel }} \
            inertiajs/inertia-laravel:${{ matrix.inertia }} \
            orchestra/testbench:${{ matrix.testbench }} \
            pestphp/pest:${{ matrix.pest }} \
            pestphp/pest-plugin-laravel:${{ matrix.pest }} \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      - name: Validate package
        run: composer validate --strict --no-check-lock

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          composer test 2>&1 | tee /tmp/pest.log

      - name: Report test failure
        if: steps.tests.outcome == 'failure'
        run: |
          message=$(tail -n 60 /tmp/pest.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::error title=KYC test suite failed::$message"
          exit 1

      - name: Audit dependencies
        run: composer audit
